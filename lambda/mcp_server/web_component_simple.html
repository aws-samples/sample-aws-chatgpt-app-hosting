<div id="coffee-root"></div>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #ffffff;
    color: #2d2d2d;
    padding: 16px;
    line-height: 1.5;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
}

.product-card {
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 8px;
    overflow: hidden;
    transition: all 0.2s ease;
    cursor: pointer;
    position: relative;
}

.product-card::after {
    content: '👆 Click for details';
    position: absolute;
    bottom: 8px;
    right: 8px;
    font-size: 11px;
    color: #10a37f;
    background: rgba(255, 255, 255, 0.95);
    padding: 4px 8px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
}

.product-card:hover {
    border-color: #10a37f;
    box-shadow: 0 4px 12px rgba(16, 163, 127, 0.15);
    transform: translateY(-4px);
}

.product-card:hover::after {
    opacity: 1;
}

.product-card:active {
    transform: translateY(-2px);
}

.product-image {
    width: 100%;
    height: 200px;
    object-fit: cover;
    background: #f7f7f7;
}

.product-content {
    padding: 16px;
}

.product-name {
    font-size: 16px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 8px;
}

.product-origin {
    font-size: 13px;
    color: #6b6b6b;
    margin-bottom: 8px;
}

.product-price {
    font-size: 18px;
    font-weight: 700;
    color: #10a37f;
    margin-top: 8px;
}

.flavor-tag {
    display: inline-block;
    font-size: 11px;
    padding: 3px 7px;
    background: #e8f5e9;
    border-radius: 3px;
    color: #2e7d32;
    margin-right: 4px;
    margin-bottom: 4px;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

<script type="module">
// Initialize when DOM is ready
console.log('[Coffee Discovery] Widget loading...');

function getImageSource(product) {
    // Prefer image_base64 over image_url
    if (product.image_base64) {
        return `data:image/png;base64,${product.image_base64}`;
    }
    return product.image_url || '';
}

function showProductDetails(product) {
    console.log('[Coffee Discovery] Showing details for:', product.product_id);
    
    // Create modal overlay
    const modal = document.createElement('div');
    modal.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 20px;
        animation: fadeIn 0.2s ease;
    `;
    
    // Create modal content
    const content = document.createElement('div');
    content.style.cssText = `
        background: white;
        border-radius: 12px;
        max-width: 600px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: slideUp 0.3s ease;
    `;
    
    // Build product details HTML
    const brewingRecs = {
        light: {
            methods: 'Pour-over, V60, Chemex, Cold brew',
            grind: 'Medium-fine to medium',
            temp: '195-205°F (90-96°C)'
        },
        medium: {
            methods: 'Drip coffee, French press, Pour-over',
            grind: 'Medium',
            temp: '200-205°F (93-96°C)'
        },
        dark: {
            methods: 'Espresso, French press, Moka pot',
            grind: 'Fine to medium',
            temp: '190-200°F (88-93°C)'
        }
    };
    
    const brewing = brewingRecs[product.roast_level] || brewingRecs.medium;
    
    content.innerHTML = `
        <div style="position: relative;">
            <button id="close-modal" style="
                position: absolute;
                top: 16px;
                right: 16px;
                background: rgba(255, 255, 255, 0.9);
                border: none;
                border-radius: 50%;
                width: 32px;
                height: 32px;
                font-size: 20px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1;
                transition: all 0.2s;
            " onmouseover="this.style.background='#f0f0f0'" onmouseout="this.style.background='rgba(255,255,255,0.9)'">×</button>
            
            <img src="${getImageSource(product)}" alt="${product.name}" style="
                width: 100%;
                height: 300px;
                object-fit: cover;
                border-radius: 12px 12px 0 0;
            " onerror="this.style.display='none'; this.insertAdjacentHTML('afterend', '<div style=\\'width:100%;height:300px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:64px;border-radius:12px 12px 0 0;\\'>☕</div>');">
            
            <div style="padding: 24px;">
                <h2 style="margin: 0 0 16px 0; font-size: 28px; color: #1a1a1a;">${product.name}</h2>
                
                <div style="display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap;">
                    <div style="display: flex; align-items: center; gap: 6px; color: #6b6b6b;">
                        <span>📍</span>
                        <span>${product.origin}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px; color: #6b6b6b;">
                        <span>☕</span>
                        <span>${product.roast_level.charAt(0).toUpperCase() + product.roast_level.slice(1)} roast</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px; color: #10a37f; font-weight: 700; font-size: 20px;">
                        <span>💰</span>
                        <span>$${product.price.toFixed(2)}</span>
                    </div>
                </div>
                
                <div style="margin-bottom: 16px;">
                    <strong style="color: #1a1a1a;">Flavor Profile:</strong>
                    <div style="margin-top: 8px;">
                        ${product.flavor_profile.map(f => `<span style="
                            display: inline-block;
                            font-size: 12px;
                            padding: 4px 10px;
                            background: #e8f5e9;
                            border-radius: 4px;
                            color: #2e7d32;
                            margin-right: 6px;
                            margin-bottom: 6px;
                        ">${f}</span>`).join('')}
                    </div>
                </div>
                
                <div style="margin-bottom: 20px; line-height: 1.6; color: #2d2d2d;">
                    ${product.description}
                </div>
                
                <div style="background: #f7f7f7; padding: 16px; border-radius: 8px;">
                    <strong style="color: #1a1a1a; display: block; margin-bottom: 12px;">☕ Brewing Recommendations</strong>
                    <div style="color: #2d2d2d; line-height: 1.8;">
                        <div><strong>Best for:</strong> ${brewing.methods}</div>
                        <div><strong>Grind:</strong> ${brewing.grind}</div>
                        <div><strong>Water temp:</strong> ${brewing.temp}</div>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    modal.appendChild(content);
    document.body.appendChild(modal);
    
    // Close modal handlers
    const closeBtn = content.querySelector('#close-modal');
    const closeModal = () => {
        modal.style.animation = 'fadeOut 0.2s ease';
        setTimeout(() => modal.remove(), 200);
    };
    
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });
}

function renderProducts() {
    console.log('[Coffee Discovery] Rendering products');
    console.log('[Coffee Discovery] window.openai:', window.openai);
    
    const root = document.getElementById('coffee-root');
    if (!root) {
        console.error('[Coffee Discovery] Root element not found');
        return;
    }
    
    const products = window.openai?.toolOutput?.products || [];
    console.log('[Coffee Discovery] Products:', products);
    
    if (products.length === 0) {
        root.innerHTML = '<p>No products found</p>';
        return;
    }
    
    const grid = document.createElement('div');
    grid.className = 'product-grid';
    
    products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        
        // Add click handler to show product details
        card.addEventListener('click', () => {
            console.log('[Coffee Discovery] Product clicked:', product.product_id);
            showProductDetails(product);
        });
        
        const img = document.createElement('img');
        img.className = 'product-image';
        img.src = getImageSource(product);
        img.alt = product.name;
        img.onerror = () => {
            // Replace image with emoji placeholder (CSP blocks data URLs)
            img.style.display = 'none';
            const placeholder = document.createElement('div');
            placeholder.style.cssText = 'width: 100%; height: 200px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 48px;';
            placeholder.textContent = '☕';
            img.parentElement.insertBefore(placeholder, img);
        };
        
        const content = document.createElement('div');
        content.className = 'product-content';
        
        const name = document.createElement('div');
        name.className = 'product-name';
        name.textContent = product.name;
        
        const origin = document.createElement('div');
        origin.className = 'product-origin';
        origin.textContent = `${product.origin} | ${product.roast_level} roast`;
        
        const flavors = document.createElement('div');
        product.flavor_profile.forEach(flavor => {
            const tag = document.createElement('span');
            tag.className = 'flavor-tag';
            tag.textContent = flavor;
            flavors.appendChild(tag);
        });
        
        const price = document.createElement('div');
        price.className = 'product-price';
        price.textContent = `$${product.price.toFixed(2)}`;
        
        content.appendChild(name);
        content.appendChild(origin);
        content.appendChild(flavors);
        content.appendChild(price);
        
        card.appendChild(img);
        card.appendChild(content);
        grid.appendChild(card);
    });
    
    root.innerHTML = '';
    root.appendChild(grid);
}

// Listen for set_globals event
window.addEventListener('openai:set_globals', (event) => {
    console.log('[Coffee Discovery] set_globals event:', event.detail);
    renderProducts();
});

// Initial render
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderProducts);
} else {
    renderProducts();
}
</script>
