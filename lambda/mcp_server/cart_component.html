<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .cart-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e0e0e0;
        }

        .cart-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }

        .cart-summary {
            text-align: right;
        }

        .cart-count {
            font-size: 14px;
            color: #666;
        }

        .cart-total {
            font-size: 20px;
            font-weight: 600;
            color: #2c5f2d;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .cart-item {
            display: flex;
            gap: 16px;
            padding: 16px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            position: relative;
        }

        .item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            background: #e0e0e0;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .item-origin {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .item-price {
            font-size: 14px;
            color: #2c5f2d;
            font-weight: 500;
        }

        .quantity-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .item-subtotal {
            text-align: right;
        }

        .subtotal-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .subtotal-value {
            font-size: 18px;
            font-weight: 600;
            color: #2c5f2d;
        }

        .empty-cart {
            text-align: center;
            padding: 48px 24px;
            color: #999;
        }

        .empty-cart-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-cart-message {
            font-size: 16px;
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 8px;
            padding: 16px;
            color: #c33;
            margin-bottom: 16px;
        }

        /* Quantity Controls */
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .qty-btn:hover:not(:disabled) {
            background: #f0f0f0;
            border-color: #ccc;
        }

        .qty-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Delete Button */
        .delete-btn {
            padding: 6px 12px;
            border: 1px solid #e74c3c;
            border-radius: 4px;
            background: white;
            color: #e74c3c;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .delete-btn:hover:not(:disabled) {
            background: #e74c3c;
            color: white;
        }

        .delete-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading State */
        .cart-item.loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .cart-item.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid #2c5f2d;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Item Error */
        .item-error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 4px;
            padding: 4px 8px;
            background: #fee;
            border-radius: 4px;
        }

        /* Item Actions Container */
        .item-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
            min-width: 100px;
        }
    </style>
</head>
<body>
    <div class="cart-container">
        <div class="cart-header">
            <h1 class="cart-title">Shopping Cart</h1>
            <div class="cart-summary">
                <div class="cart-count" id="cart-count">0 items</div>
                <div class="cart-total" id="cart-total">$0.00</div>
            </div>
        </div>

        <div id="error-container"></div>
        <div id="cart-content"></div>
    </div>

    <script>
        // Debug: Log what we receive from window.openai
        console.log('[Cart Widget] window.openai:', window.openai);
        console.log('[Cart Widget] window.openai.toolOutput:', window.openai?.toolOutput);
        
        // Get cart data from window.openai.toolOutput
        let cartData = window.openai?.toolOutput?.cart || window.openai?.toolOutput || {
            items: [],
            total_items: 0,
            total_price: 0.0,
            message: '',
            error: false
        };
        
        console.log('[Cart Widget] cartData:', cartData);

        // Initialize or get widget state for expanded items
        let widgetState = window.openai?.widgetState || {
            expandedItems: []
        };

        // Loading state management
        let loadingItems = new Set();

        // Error state management
        let itemErrors = new Map();

        // Set loading state for an item
        function setItemLoading(productId, isLoading) {
            if (isLoading) {
                loadingItems.add(productId);
            } else {
                loadingItems.delete(productId);
            }
            renderCart();
        }

        // Check if item is loading
        function isItemLoading(productId) {
            return loadingItems.has(productId);
        }

        // Show error for an item
        function showError(productId, message) {
            itemErrors.set(productId, message);
            renderCart();
            setTimeout(() => {
                itemErrors.delete(productId);
                renderCart();
            }, 3000);
        }

        // Get error for an item
        function getItemError(productId) {
            return itemErrors.get(productId) || null;
        }

        // Update cart data from tool response
        function updateCartData(result) {
            console.log('[Cart Widget] updateCartData received:', result);
            console.log('[Cart Widget] updateCartData type:', typeof result);
            console.log('[Cart Widget] updateCartData keys:', result ? Object.keys(result) : 'null');
            
            // Try multiple paths to find cart data in the response
            // The tool returns: { content: [...], structuredContent: { cart: {...} } }
            let newCartData = null;
            
            if (result?.structuredContent?.cart) {
                // Standard MCP tool response format
                newCartData = result.structuredContent.cart;
                console.log('[Cart Widget] Found cart in structuredContent.cart');
            } else if (result?.cart) {
                // Direct cart object
                newCartData = result.cart;
                console.log('[Cart Widget] Found cart in result.cart');
            } else if (result?.items !== undefined) {
                // Result is the cart data itself
                newCartData = result;
                console.log('[Cart Widget] Result is cart data directly');
            }
            
            console.log('[Cart Widget] Extracted cart data:', newCartData);
            
            if (newCartData && newCartData.items !== undefined) {
                cartData.items = newCartData.items;
                cartData.total_items = newCartData.total_items || 0;
                cartData.total_price = newCartData.total_price || 0.0;
                cartData.message = newCartData.message || '';
                cartData.error = newCartData.error || false;
                console.log('[Cart Widget] Updated cartData:', cartData);
            } else {
                console.warn('[Cart Widget] Could not extract cart data from result');
            }
            
            renderCart();
        }

        // Handle increment button click
        async function handleIncrement(productId, currentQty) {
            console.log('[Cart Widget] handleIncrement:', productId, currentQty);
            setItemLoading(productId, true);
            try {
                const result = await window.openai.callTool('update_cart_quantity', {
                    product_id: productId,
                    quantity: currentQty + 1
                });
                console.log('[Cart Widget] increment result:', result);
                updateCartData(result);
            } catch (error) {
                console.error('[Cart Widget] increment error:', error);
                showError(productId, 'Failed to update quantity');
            } finally {
                setItemLoading(productId, false);
            }
        }

        // Handle decrement button click
        async function handleDecrement(productId, currentQty) {
            console.log('[Cart Widget] handleDecrement:', productId, currentQty);
            setItemLoading(productId, true);
            try {
                if (currentQty <= 1) {
                    const result = await window.openai.callTool('remove_from_cart', {
                        product_id: productId
                    });
                    console.log('[Cart Widget] remove result:', result);
                    updateCartData(result);
                } else {
                    const result = await window.openai.callTool('update_cart_quantity', {
                        product_id: productId,
                        quantity: currentQty - 1
                    });
                    console.log('[Cart Widget] decrement result:', result);
                    updateCartData(result);
                }
            } catch (error) {
                console.error('[Cart Widget] decrement error:', error);
                showError(productId, 'Failed to update quantity');
            } finally {
                setItemLoading(productId, false);
            }
        }

        // Handle delete button click
        async function handleDelete(productId) {
            console.log('[Cart Widget] handleDelete:', productId);
            setItemLoading(productId, true);
            try {
                const result = await window.openai.callTool('remove_from_cart', {
                    product_id: productId
                });
                console.log('[Cart Widget] delete result:', result);
                updateCartData(result);
            } catch (error) {
                console.error('[Cart Widget] delete error:', error);
                showError(productId, 'Failed to remove item');
            } finally {
                setItemLoading(productId, false);
            }
        }

        // Toggle item expansion
        function toggleItemExpanded(productId) {
            const expanded = widgetState.expandedItems || [];
            const index = expanded.indexOf(productId);
            
            if (index > -1) {
                expanded.splice(index, 1);
            } else {
                expanded.push(productId);
            }
            
            widgetState.expandedItems = expanded;
            
            if (window.openai?.setWidgetState) {
                window.openai.setWidgetState(widgetState);
            }
            
            renderCart();
        }

        // Check if item is expanded
        function isItemExpanded(productId) {
            const expanded = widgetState.expandedItems || [];
            return expanded.includes(productId);
        }


        // Render cart
        function renderCart() {
            const errorContainer = document.getElementById('error-container');
            const cartContent = document.getElementById('cart-content');
            const cartCount = document.getElementById('cart-count');
            const cartTotal = document.getElementById('cart-total');

            errorContainer.innerHTML = '';
            cartContent.innerHTML = '';

            if (cartData.error) {
                errorContainer.innerHTML = `
                    <div class="error-message">
                        ${cartData.message || 'An error occurred'}
                    </div>
                `;
            }

            const itemText = cartData.total_items === 1 ? 'item' : 'items';
            cartCount.textContent = `${cartData.total_items} ${itemText}`;
            cartTotal.textContent = `$${cartData.total_price.toFixed(2)}`;

            if (cartData.items && cartData.items.length > 0) {
                const itemsHTML = cartData.items.map(item => {
                    const expanded = isItemExpanded(item.product_id);
                    const expandIcon = expanded ? '▼' : '▶';
                    const detailsStyle = expanded ? '' : 'display: none;';
                    const loading = isItemLoading(item.product_id);
                    const loadingClass = loading ? 'loading' : '';
                    const disabledAttr = loading ? 'disabled' : '';
                    const error = getItemError(item.product_id);
                    
                    return `
                        <div class="cart-item ${loadingClass}" data-product-id="${item.product_id}">
                            <div class="item-image" style="display: flex; align-items: center; justify-content: center; font-size: 32px; background: #f0f0f0;">
                                ${item.image_url ? `<img src="${item.image_url}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'; this.parentElement.innerHTML='☕';">` : '☕'}
                            </div>
                            <div class="item-details">
                                <div class="item-name" onclick="toggleItemExpanded('${item.product_id}')" style="cursor: pointer;">
                                    <span style="font-size: 12px; margin-right: 4px;">${expandIcon}</span>
                                    ${item.name}
                                </div>
                                <div class="item-origin">${item.origin} - ${item.roast_level}</div>
                                <div style="${detailsStyle}">
                                    <div class="item-description" style="font-size: 13px; color: #666; margin: 8px 0;">
                                        ${item.description || ''}
                                    </div>
                                    <div class="item-flavors" style="font-size: 12px; color: #888;">
                                        Flavors: ${(item.flavor_profile || []).join(', ')}
                                    </div>
                                </div>
                                <div class="item-price">$${item.price.toFixed(2)} each</div>
                                <div class="quantity-controls">
                                    <button class="qty-btn decrement" onclick="handleDecrement('${item.product_id}', ${item.quantity})" ${disabledAttr} aria-label="Decrease quantity">−</button>
                                    <span class="quantity-value">${item.quantity}</span>
                                    <button class="qty-btn increment" onclick="handleIncrement('${item.product_id}', ${item.quantity})" ${disabledAttr} aria-label="Increase quantity">+</button>
                                </div>
                                ${error ? `<div class="item-error">${error}</div>` : ''}
                            </div>
                            <div class="item-actions">
                                <div class="item-subtotal">
                                    <div class="subtotal-label">Subtotal</div>
                                    <div class="subtotal-value">$${item.subtotal.toFixed(2)}</div>
                                </div>
                                <button class="delete-btn" onclick="handleDelete('${item.product_id}')" ${disabledAttr} aria-label="Remove item">🗑 Remove</button>
                            </div>
                        </div>
                    `;
                }).join('');

                cartContent.innerHTML = `<div class="cart-items">${itemsHTML}</div>`;
            } else {
                cartContent.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <div class="empty-cart-message">Your cart is empty</div>
                    </div>
                `;
            }
        }

        // Listen for set_globals event
        window.addEventListener('openai:set_globals', (event) => {
            console.log('[Cart Widget] set_globals event:', event.detail);
            const newData = window.openai?.toolOutput?.cart || window.openai?.toolOutput;
            if (newData) {
                Object.assign(cartData, newData);
            }
            renderCart();
        });

        // Initial render
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderCart);
        } else {
            renderCart();
        }
    </script>
</body>
</html>
