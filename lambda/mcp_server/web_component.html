<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Discovery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #2d2d2d;
            padding: 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e5e5;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            color: #6b6b6b;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .product-card {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .product-card:hover {
            border-color: #10a37f;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f7f7f7;
        }

        .product-content {
            padding: 16px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .product-origin {
            font-size: 13px;
            color: #6b6b6b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .product-origin::before {
            content: "📍";
            font-size: 12px;
        }

        .product-details {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .detail-badge {
            font-size: 11px;
            padding: 4px 8px;
            background: #f0f0f0;
            border-radius: 4px;
            color: #4a4a4a;
            font-weight: 500;
            text-transform: capitalize;
        }

        .detail-badge.roast {
            background: #fff4e6;
            color: #8b5a00;
        }

        .flavor-profiles {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 10px;
        }

        .flavor-tag {
            font-size: 11px;
            padding: 3px 7px;
            background: #e8f5e9;
            border-radius: 3px;
            color: #2e7d32;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: #10a37f;
        }

        /* Product Footer Layout */
        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        /* Add to Cart Button Base Styles */
        .add-to-cart-btn {
            background: #10a37f;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 110px;
        }

        .add-to-cart-btn:hover {
            background: #0d8a6a;
            transform: translateY(-1px);
        }

        .add-to-cart-btn:active {
            transform: translateY(0);
        }

        /* Loading State */
        .add-to-cart-btn.loading {
            background: #6b6b6b;
            cursor: wait;
        }

        /* Success State */
        .add-to-cart-btn.success {
            background: #2e7d32;
        }

        /* Error State */
        .add-to-cart-btn.error {
            background: #c33;
        }

        /* Disabled State */
        .add-to-cart-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Error Message */
        .add-to-cart-error {
            font-size: 11px;
            color: #c33;
            margin-top: 4px;
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b6b6b;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h2 {
            font-size: 18px;
            font-weight: 600;
            color: #2d2d2d;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: #6b6b6b;
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 16px;
            color: #c33;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #6b6b6b;
            font-size: 14px;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Responsive adjustments for ChatGPT iframe */
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }

            .product-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .product-image {
                height: 180px;
            }

            .header h1 {
                font-size: 18px;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Product Detail Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #f0f0f0;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: #e0e0e0;
        }

        .modal-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px 12px 0 0;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .modal-origin {
            font-size: 14px;
            color: #6b6b6b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .modal-origin::before {
            content: "📍";
        }

        .modal-section {
            margin-bottom: 16px;
        }

        .modal-section-title {
            font-size: 12px;
            font-weight: 600;
            color: #6b6b6b;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .modal-description {
            font-size: 14px;
            color: #4a4a4a;
            line-height: 1.6;
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid #e5e5e5;
        }

        .modal-price {
            font-size: 24px;
            font-weight: 700;
            color: #10a37f;
        }

        .modal-add-to-cart {
            background: #10a37f;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-add-to-cart:hover {
            background: #0d8a6a;
        }

        .modal-add-to-cart.loading {
            background: #6b6b6b;
            cursor: wait;
        }

        .modal-add-to-cart.success {
            background: #2e7d32;
        }

        .modal-add-to-cart.error {
            background: #c33;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>☕ Coffee Discovery</h1>
            <p id="result-count">Loading products...</p>
        </div>
        <div id="error-container"></div>
        <div id="product-container" class="product-grid"></div>
    </div>

    <!-- Product Detail Modal -->
    <div id="product-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <img id="modal-image" class="modal-image" src="" alt="">
            <div class="modal-body">
                <h2 id="modal-title" class="modal-title"></h2>
                <div id="modal-origin" class="modal-origin"></div>
                <div class="modal-section">
                    <div class="modal-section-title">Roast Level</div>
                    <div id="modal-roast" class="detail-badge roast"></div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">Flavor Profile</div>
                    <div id="modal-flavors" class="flavor-profiles"></div>
                </div>
                <div id="modal-description-section" class="modal-section">
                    <div class="modal-section-title">Description</div>
                    <p id="modal-description" class="modal-description"></p>
                </div>
                <div class="modal-footer">
                    <div id="modal-price" class="modal-price"></div>
                    <button id="modal-add-to-cart" class="modal-add-to-cart">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let currentProducts = [];

        /**
         * Initialize the web component
         */
        function init() {
            console.log('[Coffee Discovery] Initializing web component');
            
            // Listen for openai:set_globals event
            window.addEventListener('openai:set_globals', handleSetGlobals);
            
            // Try to load initial products from window.openai.toolOutput
            loadInitialProducts();
        }

        /**
         * Load initial products from window.openai.toolOutput
         */
        function loadInitialProducts() {
            try {
                if (window.openai && window.openai.toolOutput) {
                    console.log('[Coffee Discovery] Loading from toolOutput:', window.openai.toolOutput);
                    const products = window.openai.toolOutput.products || [];
                    renderProducts(products);
                } else {
                    console.log('[Coffee Discovery] No toolOutput available yet');
                    showLoading();
                }
            } catch (error) {
                console.error('[Coffee Discovery] Error loading initial products:', error);
                showError('Failed to load products. Please try again.');
            }
        }

        /**
         * Handle openai:set_globals event
         */
        function handleSetGlobals(event) {
            console.log('[Coffee Discovery] Received set_globals event:', event.detail);
            
            try {
                const globals = event.detail?.globals;
                if (globals && globals.toolOutput) {
                    const products = globals.toolOutput.products || [];
                    renderProducts(products);
                }
            } catch (error) {
                console.error('[Coffee Discovery] Error handling set_globals:', error);
                showError('Failed to update products. Please try again.');
            }
        }

        /**
         * Render products in the grid
         */
        function renderProducts(products) {
            console.log('[Coffee Discovery] Rendering products:', products.length);
            
            currentProducts = products;
            const container = document.getElementById('product-container');
            const errorContainer = document.getElementById('error-container');
            const resultCount = document.getElementById('result-count');
            
            // Clear error messages
            errorContainer.innerHTML = '';
            
            // Update result count
            if (products.length === 0) {
                resultCount.textContent = 'No products found';
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">☕</div>
                        <h2>No coffee beans found</h2>
                        <p>Try adjusting your preferences or filters</p>
                    </div>
                `;
                return;
            }
            
            resultCount.textContent = `Found ${products.length} coffee ${products.length === 1 ? 'bean' : 'beans'}`;
            
            // Render product cards
            container.innerHTML = products.map(product => createProductCard(product)).join('');
            
            // Add click handlers for cards and Add to Cart buttons
            products.forEach((product, index) => {
                const card = container.children[index];
                if (card) {
                    card.addEventListener('click', () => handleProductClick(product));
                    
                    // Add click handler for Add to Cart button
                    const addToCartBtn = card.querySelector('.add-to-cart-btn');
                    if (addToCartBtn) {
                        addToCartBtn.addEventListener('click', (e) => handleAddToCart(e, product));
                    }
                }
            });
        }

        /**
         * Create HTML for a product card
         */
        function createProductCard(product) {
            const flavorTags = (product.flavor_profile || [])
                .map(flavor => `<span class="flavor-tag">${escapeHtml(flavor)}</span>`)
                .join('');
            
            return `
                <div class="product-card" data-product-id="${escapeHtml(product.product_id)}">
                    <img 
                        class="product-image" 
                        src="${escapeHtml(product.image_url)}" 
                        alt="${escapeHtml(product.name)}"
                        onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22400%22 height=%22300%22/%3E%3Ctext fill=%22%23999%22 font-family=%22sans-serif%22 font-size=%2224%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22%3E☕%3C/text%3E%3C/svg%3E'"
                    />
                    <div class="product-content">
                        <div class="product-name">${escapeHtml(product.name)}</div>
                        <div class="product-origin">${escapeHtml(product.origin)}</div>
                        <div class="product-details">
                            <span class="detail-badge roast">${escapeHtml(product.roast_level)} roast</span>
                        </div>
                        <div class="flavor-profiles">
                            ${flavorTags}
                        </div>
                        <div class="product-footer">
                            <div class="product-price">$${product.price.toFixed(2)}</div>
                            <button class="add-to-cart-btn" data-product-id="${escapeHtml(product.product_id)}" aria-label="Add ${escapeHtml(product.name)} to cart">
                                Add to Cart
                            </button>
                        </div>
                        <div class="add-to-cart-error"></div>
                    </div>
                </div>
            `;
        }

        /**
         * Handle product card click - show product details in modal
         */
        async function handleProductClick(product) {
            console.log('[Coffee Discovery] Product clicked:', product.product_id);
            
            // Show modal with product details (use local product data, no API call needed)
            showProductModal(product);
        }

        /**
         * Show product detail modal
         */
        function showProductModal(product) {
            const modal = document.getElementById('product-modal');
            
            // Populate modal with product data
            document.getElementById('modal-image').src = product.image_url || '';
            document.getElementById('modal-image').alt = product.name || '';
            document.getElementById('modal-title').textContent = product.name || '';
            document.getElementById('modal-origin').textContent = product.origin || '';
            document.getElementById('modal-roast').textContent = (product.roast_level || '') + ' roast';
            document.getElementById('modal-price').textContent = '$' + (product.price || 0).toFixed(2);
            
            // Flavor tags
            const flavorsContainer = document.getElementById('modal-flavors');
            const flavors = product.flavor_profile || [];
            flavorsContainer.innerHTML = flavors.map(f => `<span class="flavor-tag">${escapeHtml(f)}</span>`).join('');
            
            // Description (if available)
            const descSection = document.getElementById('modal-description-section');
            const descEl = document.getElementById('modal-description');
            if (product.description) {
                descEl.textContent = product.description;
                descSection.style.display = 'block';
            } else {
                descSection.style.display = 'none';
            }
            
            // Set up Add to Cart button in modal
            const modalAddBtn = document.getElementById('modal-add-to-cart');
            modalAddBtn.className = 'modal-add-to-cart'; // Reset state
            modalAddBtn.textContent = 'Add to Cart';
            modalAddBtn.disabled = false;
            modalAddBtn.onclick = () => handleModalAddToCart(product, modalAddBtn);
            
            // Show modal
            modal.classList.add('active');
        }

        /**
         * Close product detail modal
         */
        function closeModal() {
            const modal = document.getElementById('product-modal');
            modal.classList.remove('active');
        }

        /**
         * Handle Add to Cart from modal
         */
        async function handleModalAddToCart(product, button) {
            console.log('[Coffee Discovery] Modal add to cart:', product.product_id);
            
            // Set loading state
            button.classList.add('loading');
            button.textContent = 'Adding...';
            button.disabled = true;
            
            try {
                if (!window.openai || typeof window.openai.callTool !== 'function') {
                    button.classList.remove('loading');
                    button.classList.add('error');
                    button.textContent = 'Error';
                    setTimeout(() => {
                        button.className = 'modal-add-to-cart';
                        button.textContent = 'Add to Cart';
                        button.disabled = false;
                    }, 2000);
                    return;
                }
                
                const response = await window.openai.callTool('add_to_cart', {
                    product_id: product.product_id,
                    quantity: 1
                });
                
                console.log('[Coffee Discovery] Modal add to cart response:', response);
                
                // Show success
                button.classList.remove('loading');
                button.classList.add('success');
                button.textContent = 'Added! ✓';
                button.disabled = false;
                
                // Reset after delay
                setTimeout(() => {
                    button.className = 'modal-add-to-cart';
                    button.textContent = 'Add to Cart';
                }, 2000);
                
            } catch (error) {
                console.error('[Coffee Discovery] Modal add to cart error:', error);
                button.classList.remove('loading');
                button.classList.add('error');
                button.textContent = 'Try Again';
                button.disabled = false;
                
                setTimeout(() => {
                    button.className = 'modal-add-to-cart';
                    button.textContent = 'Add to Cart';
                }, 3000);
            }
        }

        /**
         * Handle Add to Cart button click
         */
        async function handleAddToCart(event, product) {
            // Stop event propagation to prevent card click
            event.stopPropagation();
            
            const button = event.currentTarget;
            const productId = product.product_id;
            
            console.log('[Coffee Discovery] Add to cart clicked:', productId);
            
            // Set loading state
            setButtonState(button, 'loading');
            
            try {
                // Check if window.openai.callTool is available
                if (!window.openai || typeof window.openai.callTool !== 'function') {
                    console.warn('[Coffee Discovery] window.openai.callTool not available');
                    setButtonState(button, 'error', 'Unable to add to cart');
                    setTimeout(() => setButtonState(button, 'default'), 3000);
                    return;
                }
                
                // Call add_to_cart via MCP
                const response = await window.openai.callTool('add_to_cart', {
                    product_id: productId,
                    quantity: 1
                });
                
                console.log('[Coffee Discovery] Add to cart response:', response);
                
                // Check for error in response
                if (response && response.error) {
                    setButtonState(button, 'error', response.message || 'Failed to add to cart');
                    setTimeout(() => setButtonState(button, 'default'), 3000);
                } else {
                    // Show success state
                    setButtonState(button, 'success');
                    // Reset to default after delay
                    setTimeout(() => setButtonState(button, 'default'), 2000);
                }
                
            } catch (error) {
                console.error('[Coffee Discovery] Add to cart error:', error);
                setButtonState(button, 'error', 'Unable to add to cart. Please try again.');
                // Reset to default after delay to allow retry
                setTimeout(() => setButtonState(button, 'default'), 3000);
            }
        }

        /**
         * Set button visual state
         * @param {HTMLElement} button - Button element
         * @param {string} state - 'default' | 'loading' | 'success' | 'error'
         * @param {string} errorMessage - Optional error message
         */
        function setButtonState(button, state, errorMessage = '') {
            // Remove all state classes
            button.classList.remove('loading', 'success', 'error');
            
            switch (state) {
                case 'loading':
                    button.classList.add('loading');
                    button.textContent = 'Adding...';
                    button.disabled = true;
                    hideButtonError(button);
                    break;
                case 'success':
                    button.classList.add('success');
                    button.textContent = 'Added! ✓';
                    button.disabled = false;
                    hideButtonError(button);
                    break;
                case 'error':
                    button.classList.add('error');
                    button.textContent = 'Try Again';
                    button.disabled = false;
                    showButtonError(button, errorMessage);
                    break;
                default:
                    button.textContent = 'Add to Cart';
                    button.disabled = false;
                    hideButtonError(button);
            }
        }

        /**
         * Show error message near button
         */
        function showButtonError(button, message) {
            const errorEl = button.closest('.product-content').querySelector('.add-to-cart-error');
            if (errorEl && message) {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
            }
        }

        /**
         * Hide error message
         */
        function hideButtonError(button) {
            const errorEl = button.closest('.product-content').querySelector('.add-to-cart-error');
            if (errorEl) {
                errorEl.style.display = 'none';
            }
        }

        /**
         * Show loading state
         */
        function showLoading() {
            const container = document.getElementById('product-container');
            container.innerHTML = '<div class="loading">Loading products</div>';
        }

        /**
         * Show error message
         */
        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `<div class="error-message">${escapeHtml(message)}</div>`;
        }

        /**
         * Escape HTML to prevent XSS
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal when clicking outside
        document.addEventListener('click', function(e) {
            const modal = document.getElementById('product-modal');
            if (e.target === modal) {
                closeModal();
            }
        });

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
