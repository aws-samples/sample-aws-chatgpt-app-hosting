<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Discovery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #2d2d2d;
            padding: 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e5e5;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            color: #6b6b6b;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .product-card {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .product-card:hover {
            border-color: #10a37f;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f7f7f7;
        }

        .product-content {
            padding: 16px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .product-origin {
            font-size: 13px;
            color: #6b6b6b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .product-origin::before {
            content: "📍";
            font-size: 12px;
        }

        .product-details {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .detail-badge {
            font-size: 11px;
            padding: 4px 8px;
            background: #f0f0f0;
            border-radius: 4px;
            color: #4a4a4a;
            font-weight: 500;
            text-transform: capitalize;
        }

        .detail-badge.roast {
            background: #fff4e6;
            color: #8b5a00;
        }

        .flavor-profiles {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 10px;
        }

        .flavor-tag {
            font-size: 11px;
            padding: 3px 7px;
            background: #e8f5e9;
            border-radius: 3px;
            color: #2e7d32;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: #10a37f;
            margin-top: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b6b6b;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h2 {
            font-size: 18px;
            font-weight: 600;
            color: #2d2d2d;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: #6b6b6b;
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 16px;
            color: #c33;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #6b6b6b;
            font-size: 14px;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Responsive adjustments for ChatGPT iframe */
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }

            .product-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .product-image {
                height: 180px;
            }

            .header h1 {
                font-size: 18px;
            }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>☕ Coffee Discovery</h1>
            <p id="result-count">Loading products...</p>
        </div>
        <div id="error-container"></div>
        <div id="product-container" class="product-grid"></div>
    </div>

    <script>
        // Global state
        let currentProducts = [];

        /**
         * Initialize the web component
         */
        function init() {
            console.log('[Coffee Discovery] Initializing web component');
            
            // Listen for openai:set_globals event
            window.addEventListener('openai:set_globals', handleSetGlobals);
            
            // Try to load initial products from window.openai.toolOutput
            loadInitialProducts();
        }

        /**
         * Load initial products from window.openai.toolOutput
         */
        function loadInitialProducts() {
            try {
                if (window.openai && window.openai.toolOutput) {
                    console.log('[Coffee Discovery] Loading from toolOutput:', window.openai.toolOutput);
                    const products = window.openai.toolOutput.products || [];
                    renderProducts(products);
                } else {
                    console.log('[Coffee Discovery] No toolOutput available yet');
                    showLoading();
                }
            } catch (error) {
                console.error('[Coffee Discovery] Error loading initial products:', error);
                showError('Failed to load products. Please try again.');
            }
        }

        /**
         * Handle openai:set_globals event
         */
        function handleSetGlobals(event) {
            console.log('[Coffee Discovery] Received set_globals event:', event.detail);
            
            try {
                const globals = event.detail?.globals;
                if (globals && globals.toolOutput) {
                    const products = globals.toolOutput.products || [];
                    renderProducts(products);
                }
            } catch (error) {
                console.error('[Coffee Discovery] Error handling set_globals:', error);
                showError('Failed to update products. Please try again.');
            }
        }

        /**
         * Render products in the grid
         */
        function renderProducts(products) {
            console.log('[Coffee Discovery] Rendering products:', products.length);
            
            currentProducts = products;
            const container = document.getElementById('product-container');
            const errorContainer = document.getElementById('error-container');
            const resultCount = document.getElementById('result-count');
            
            // Clear error messages
            errorContainer.innerHTML = '';
            
            // Update result count
            if (products.length === 0) {
                resultCount.textContent = 'No products found';
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">☕</div>
                        <h2>No coffee beans found</h2>
                        <p>Try adjusting your preferences or filters</p>
                    </div>
                `;
                return;
            }
            
            resultCount.textContent = `Found ${products.length} coffee ${products.length === 1 ? 'bean' : 'beans'}`;
            
            // Render product cards
            container.innerHTML = products.map(product => createProductCard(product)).join('');
            
            // Add click handlers
            products.forEach((product, index) => {
                const card = container.children[index];
                if (card) {
                    card.addEventListener('click', () => handleProductClick(product));
                }
            });
        }

        /**
         * Create HTML for a product card
         */
        function createProductCard(product) {
            const flavorTags = (product.flavor_profile || [])
                .map(flavor => `<span class="flavor-tag">${escapeHtml(flavor)}</span>`)
                .join('');
            
            // Use CloudFront URL for images (served from private S3 via CDN)
            const imageSrc = escapeHtml(product.image_url);
            
            return `
                <div class="product-card" data-product-id="${escapeHtml(product.product_id)}">
                    <img 
                        class="product-image" 
                        src="${imageSrc}" 
                        alt="${escapeHtml(product.name)}"
                        onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22400%22 height=%22300%22/%3E%3Ctext fill=%22%23999%22 font-family=%22sans-serif%22 font-size=%2224%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22%3E☕%3C/text%3E%3C/svg%3E'"
                    />
                    <div class="product-content">
                        <div class="product-name">${escapeHtml(product.name)}</div>
                        <div class="product-origin">${escapeHtml(product.origin)}</div>
                        <div class="product-details">
                            <span class="detail-badge roast">${escapeHtml(product.roast_level)} roast</span>
                        </div>
                        <div class="flavor-profiles">
                            ${flavorTags}
                        </div>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                    </div>
                </div>
            `;
        }

        /**
         * Handle product card click
         */
        async function handleProductClick(product) {
            console.log('[Coffee Discovery] Product clicked:', product.product_id);
            
            try {
                // Check if window.openai.callTool is available
                if (!window.openai || typeof window.openai.callTool !== 'function') {
                    console.warn('[Coffee Discovery] window.openai.callTool not available');
                    return;
                }
                
                // Call get_product_details tool
                showLoading();
                const response = await window.openai.callTool('get_product_details', {
                    product_id: product.product_id
                });
                
                console.log('[Coffee Discovery] Tool response:', response);
                
                // The response will trigger a set_globals event, which will update the display
            } catch (error) {
                console.error('[Coffee Discovery] Error calling tool:', error);
                showError('Failed to load product details. Please try again.');
            }
        }

        /**
         * Show loading state
         */
        function showLoading() {
            const container = document.getElementById('product-container');
            container.innerHTML = '<div class="loading">Loading products</div>';
        }

        /**
         * Show error message
         */
        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `<div class="error-message">${escapeHtml(message)}</div>`;
        }

        /**
         * Escape HTML to prevent XSS
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
